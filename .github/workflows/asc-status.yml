name: App Store status check (read-only)
# Read-only. A push of this file to ios-capacitor runs the check. workflow_dispatch is the other trigger.
# Does not submit for review, attach a build, or change purchases, prices, or availability.
on:
  workflow_dispatch:
  push:
    branches: [ios-capacitor]
    paths: [".github/workflows/asc-status.yml"]
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - run: pip install -q pyjwt cryptography requests
      - name: Query App Store Connect
        shell: python
        run: |
          import os,re,time,jwt,requests
          b=re.sub(r'-----(BEGIN|END) PRIVATE KEY-----','',os.environ['RAW']); b=re.sub(r'[^A-Za-z0-9+/=]','',b)
          key='-----BEGIN PRIVATE KEY-----\n'+'\n'.join(b[i:i+64] for i in range(0,len(b),64))+'\n-----END PRIVATE KEY-----\n'
          tok=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":int(time.time()),"exp":int(time.time())+1200,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":os.environ["ASC_KEY_ID"]})
          H={"Authorization":"Bearer "+tok}; A="https://api.appstoreconnect.apple.com/v1/"
          def g(p):
            r=requests.get(A+p,headers=H); j=r.json()
            if r.status_code>=400: out.append(f"ERR {p}: {r.status_code} {str(j)[:200]}")
            return j
          out=[]
          app=g("apps?filter[bundleId]=com.wrap911.trainer")["data"][0]; aid=app["id"]
          out.append(f"App: {app['attributes']['name']} ({aid})")
          for v in g(f"apps/{aid}/appStoreVersions?limit=5").get("data",[]):
            a=v["attributes"]; out.append(f"Version {a['versionString']}: appStoreState={a.get('appStoreState')} appVersionState={a.get('appVersionState')} releaseType={a.get('releaseType')} created={a.get('createdDate')}")
          for s in g(f"reviewSubmissions?filter[app]={aid}&limit=5").get("data",[]):
            a=s["attributes"]; out.append(f"Review submission: state={a.get('state')} submitted={a.get('submittedDate')}")
          for bd in g(f"builds?filter[app]={aid}&sort=-uploadedDate&limit=5").get("data",[]):
            a=bd["attributes"]; out.append(f"Build {a['version']}: processing={a.get('processingState')} uploaded={a.get('uploadedDate')} expired={a.get('expired')}")
          for sg in g(f"apps/{aid}/subscriptionGroups").get("data",[]):
            out.append(f"Subscription group: {sg['attributes'].get('referenceName')}")
            for s in g(f"subscriptionGroups/{sg['id']}/subscriptions").get("data",[]):
              a=s["attributes"]; out.append(f"  Sub {a.get('productId')} {a.get('name')} state={a.get('state')} period={a.get('subscriptionPeriod')}")
          for p in g(f"apps/{aid}/inAppPurchasesV2").get("data",[]):
            a=p["attributes"]; out.append(f"IAP {a.get('productId')} type={a.get('inAppPurchaseType')} state={a.get('state')}")
          txt="\n".join(out); print(txt)
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("```\n"+txt+"\n```\n")
