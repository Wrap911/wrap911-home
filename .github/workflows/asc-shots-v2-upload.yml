name: ASC screenshots v2 upload
# Uploads reviewed v2 screenshots to the editable App Store version (creates 1.2 if none).
# Does not attach a build and does not submit for review.
on:
  workflow_dispatch:
  push:
    branches: [cursor/asc-screenshots-v2-nov21]
    paths: [".github/workflows/asc-shots-v2-upload.yml"]
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - run: python3 scripts/asc-screenshots-v2.py
