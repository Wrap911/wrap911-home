name: Submit build 32 for TestFlight beta review
# External TestFlight review for build 32 only. Does not touch App Store review or version 1.2.
on:
  workflow_dispatch:
  push:
    branches: [cursor/ios-web-parity-1.3]
    paths:
      - .github/workflows/asc-beta-review-build32.yml
      - scripts/asc-beta-review-build32.py
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Submit build 32 for beta review
        run: python3 scripts/asc-beta-review-build32.py
