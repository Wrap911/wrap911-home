name: ASC resubmit v1.1 build 20 (temp)
# run 2
on:
  push:
    branches: [asc-resubmit-v11]
    paths: [".github/workflows/asc-resubmit-v11.yml"]
jobs:
  resubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - run: pip install -q pyjwt cryptography requests
      - name: Attach build 20, set notes, resubmit
        shell: python
        run: |
          import os,re,time,jwt,requests,json,sys
          b=re.sub(r'-----(BEGIN|END) PRIVATE KEY-----','',os.environ['RAW']); b=re.sub(r'[^A-Za-z0-9+/=]','',b)
          key='-----BEGIN PRIVATE KEY-----\n'+'\n'.join(b[i:i+64] for i in range(0,len(b),64))+'\n-----END PRIVATE KEY-----\n'
          def H():
            t=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":int(time.time()),"exp":int(time.time())+1100,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":os.environ["ASC_KEY_ID"]})
            return {"Authorization":"Bearer "+t,"Content-Type":"application/json"}
          A="https://api.appstoreconnect.apple.com/"
          def req(m,p,body=None):
            r=requests.request(m,A+p,headers=H(),data=json.dumps(body) if body else None)
            try: j=r.json()
            except Exception: j={}
            if r.status_code>=400: print(f"ERR {m} {p}: {r.status_code} {json.dumps(j.get('errors',''))[:700]}")
            else: print(f"OK {m} {p}: {r.status_code}")
            return r.status_code,j
          aid="6816763473"; vid="ad69dc48-d34b-45e6-bd4a-41e4ec9f1ecd"; sid="6e6b5317-ef80-4ed8-9d52-1f1a3ff79d41"
          NOTES="Guideline 3.1.1: Shop Pack (com.wrap911.trainer.pack.12mo) and Seat (com.wrap911.trainer.seat.12mo) are non-renewing In-App Purchases on the Pricing screen, reachable without an account. Restore Purchases is on that screen. The app does not link to Stripe or website checkout and has no unlock-code field. Paid access is read from StoreKit."
          # run 2: build 20 already attached and notes set in run 1; resolve rejected item and submit
          c,j=req("GET",f"v1/appStoreVersions/{vid}/build"); print("attached build:", j.get("data",{}).get("attributes",{}).get("version"))
          c,j=req("GET",f"v1/appStoreVersions/{vid}/appStoreReviewDetail"); print("notes match:", j.get("data",{}).get("attributes",{}).get("notes")==NOTES)
          c,j=req("GET",f"v1/reviewSubmissions/{sid}/items?limit=50")
          for it in j.get("data",[]):
            print(" item", it["id"][-12:], it["attributes"])
            if it["attributes"].get("state") in ("REJECTED","UNRESOLVED_ISSUES"):
              req("PATCH",f"v1/reviewSubmissionItems/{it['id']}",{"data":{"type":"reviewSubmissionItems","id":it["id"],"attributes":{"resolved":True}}})
          ok=False
          for i in range(20):
            c,j=req("PATCH",f"v1/reviewSubmissions/{sid}",{"data":{"type":"reviewSubmissions","id":sid,"attributes":{"submitted":True}}})
            if c<400: ok=True; break
            time.sleep(60)
          print("SUBMITTED" if ok else "SUBMIT FAILED after retries")
          time.sleep(20)
          # 7) verify
          c,j=req("GET",f"v1/apps/{aid}/appStoreVersions?limit=3")
          for v in j.get("data",[]): print("Version", v["attributes"]["versionString"], v["attributes"].get("appStoreState"), v["attributes"].get("appVersionState"))
          c,j=req("GET",f"v1/reviewSubmissions?filter[app]={aid}&limit=10")
          for s in j.get("data",[]):
            print("Submission", s["id"], s["attributes"])
            c2,j2=req("GET",f"v1/reviewSubmissions/{s['id']}/items?limit=50")
            for it in j2.get("data",[]): print("  item", it["id"][-12:], it["attributes"].get("state"))
          c,j=req("GET",f"v1/apps/{aid}/inAppPurchasesV2?limit=50")
          for p in j.get("data",[]): print("IAP", p["attributes"].get("productId"), p["attributes"].get("state"))
