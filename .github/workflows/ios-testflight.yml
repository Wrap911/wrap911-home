name: iOS build and upload to App Store Connect
# A push of this file to ios-capacitor starts an upload. workflow_dispatch is the other trigger.
# Upload the build that carries the approved aqua-outlined app icon.
# Upload the build that presents the App Store purchase sheet.
# Upload the build that shows the purchase diagnostic and presents the sheet on the visible window.
# Upload the build that keeps one window and records the Seat tap.
# Re-upload after the native-purchases patch hunk count is corrected.
# Upload the release build with the purchase diagnostics hidden.
# Upload the build whose customer email is info@wrap911.com.
# Upload the build that restores a non-renewing Seat or Shop Pack from StoreKit.
# Upload the build that ships trainer 2.7.6 photo cards and scenarios.
# Upload build 21: Restore reads on-device StoreKit and does not show an Apple Account password sheet. Film brands are 3M, Avery Dennison, and BriteLine.
# Upload build 22: Restore with email for non-renewing Seat and Shop Pack. Same-phone check stays on-device. No Apple Account password sheet.
# Upload build 24 on version 1.2: 7-Day Pass (com.wrap911.trainer.pass.7d), non-renewing, 7 days from purchase. Restore with email. No Apple Account password sheet.
# Upload build 25 on version 1.2: pricing heading above the card, Seat and 7-Day Pass outlined, no stray privacy link.
# Version 1.3 build 26 adds Problem Doctor. A push of this file on cursor/ios-web-parity-1.3 uploads that branch only.
# Version 1.3 build 27 adds the field-photo backgrounds and the Storefront card label. Same branch-only upload.
# Version 1.3 build 28 fixes the Material calculator (54 in roll, waste 10-20, labels above boxes). Same branch-only upload.
# Version 1.3 build 29 adds Search, Settings and Help and pins the header and bottom nav. Same branch-only upload.
# Version 1.3 build 30 makes Restore purchases Apple-only (no email or code step). Same branch-only upload.
# Version 1.3 build 31 adds beginner search, a lesson teaser before the paywall, I'm stuck / first install on Home, iOS Shop Rules (no Safari or Add to Home Screen), one Mustang RTR still, calculator default 54 in, and Doctor/readOnDevice fixes. Same branch-only upload.
# Version 1.3 build 32 adds the Weekly Challenge and ranks, an offline Quick Fix lookup, and Shop Pack crew codes by email (no code entry in the app). Same branch-only upload.
# Version 1.3 build 33 adds Start here and a four-button home. Upload only from cursor/ios-1.3-start-here.
# Version 1.4 build 34 adds the job manager tools. Upload only from cursor/ios-1.4-job-manager-5bbf.
# Version 1.4 build 35 fixes the Coach screen so the back link no longer covers Problem Doctor. Same branch-only upload. Internal team only. No App Review.
# Version 1.4 build 36 adds the independence line. Same branch-only upload. Internal team only. No App Review.
# Version 1.4 build 37 is the screen QC pass. Same branch-only upload. Internal team only. No App Review.
# Version 1.4 build 38 removes em dashes from lesson and Coach copy. Same branch-only upload. Internal team only. No App Review.
# Version 1.4 build 39 adds the new stills and splits shared posters. Same branch-only upload. Internal team only. No App Review.
# Do not push this file to ios-capacitor or main.
on:
  workflow_dispatch:
  push:
    branches: [cursor/ios-1.4-job-manager-5bbf]
    paths: [".github/workflows/ios-testflight.yml"]
jobs:
  build:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: com.wrap911.trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo $X
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          export RAW='${{ secrets.ASC_KEY_P8 }}'
          python3 -c "import os,re; b=re.sub(r'-----(BEGIN|END) PRIVATE KEY-----','',os.environ['RAW']); b=re.sub(r'[^A-Za-z0-9+/=]','',b); print('-----BEGIN PRIVATE KEY-----'); [print(b[i:i+64]) for i in range(0,len(b),64)]; print('-----END PRIVATE KEY-----')" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV
      - name: Look up team and app in App Store Connect
        run: |
          python3 -m venv $RUNNER_TEMP/venv && . $RUNNER_TEMP/venv/bin/activate
          pip install --quiet pyjwt cryptography requests
          python - <<'PY'
          import jwt, time, os, requests, sys
          key=open(os.environ["KEY_PATH"]).read()
          tok=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":int(time.time()),"exp":int(time.time())+1200,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":os.environ["ASC_KEY_ID"]})
          H={"Authorization":"Bearer "+tok}; B="https://api.appstoreconnect.apple.com/v1"
          bid=os.environ["BUNDLE_ID"]
          r=requests.get(B+"/bundleIds",params={"filter[identifier]":bid},headers=H); print("bundleIds",r.status_code)
          if r.status_code!=200: print(r.text[:500]); sys.exit(1)
          d=[x for x in r.json()["data"] if x["attributes"]["identifier"]==bid]
          if not d:
              r=requests.post(B+"/bundleIds",headers=H,json={"data":{"type":"bundleIds","attributes":{"identifier":bid,"name":"Wrap911","platform":"IOS"}}}); print("create bundle",r.status_code,r.text[:300]); r.raise_for_status(); d=[r.json()["data"]]
          team=d[0]["attributes"]["seedId"]; print("team",team)
          open(os.environ["GITHUB_ENV"],"a").write(f"TEAM_ID={team}\n")
          a=requests.get(B+"/apps",params={"filter[bundleId]":bid},headers=H).json().get("data",[])
          if not a:
              print("::error::NO_APP_RECORD: create the app in App Store Connect (Apps > + > New App) with bundle ID "+bid); sys.exit(1)
          print("app", a[0]["id"], a[0]["attributes"]["name"])
          PY
      - name: Build web and sync Capacitor
        run: |
          npm ci
          npm install --no-save @capacitor/cli@^8.5
          npm run build:www
          npx cap sync ios
      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= MARKETING_VERSION=1.4 CURRENT_PROJECT_VERSION=39 \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportPath $RUNNER_TEMP/out \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls $RUNNER_TEMP/out
      - name: Upload to App Store Connect
        run: xcrun altool --upload-app -f $RUNNER_TEMP/out/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
