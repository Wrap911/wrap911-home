name: App Store status pull
# GET only, except one ongoing analytics request when the app has none.
# Does not submit review or edit the app. Do not merge this branch.
on:
  push:
    branches: [cursor/asc-sales-readonly-23b0]
    paths:
      - .github/workflows/asc-status-pull.yml
      - scripts/asc-status-pull.py
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
      ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
      APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}
      VENDOR_NUMBER: ${{ secrets.VENDOR_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Read version, sales, and analytics
        run: python3 scripts/asc-status-pull.py
