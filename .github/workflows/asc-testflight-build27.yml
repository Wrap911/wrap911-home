name: TestFlight build 27 internal access
# Runs only on the 1.3 branch. Does not create an App Store version or edit 1.2.
on:
  push:
    branches: [cursor/ios-web-parity-1.3]
    paths:
      - .github/workflows/asc-testflight-build27.yml
      - scripts/asc-testflight-build27.py
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Wait for build 27 and open internal testing
        run: python3 scripts/asc-testflight-build27.py
