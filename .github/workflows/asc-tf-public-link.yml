name: TestFlight public link
# Creates or reuses the external public tester group. Does not add a build,
# does not submit beta review, and does not edit version 1.2.
on:
  workflow_dispatch:
  push:
    branches: [cursor/ios-web-parity-1.3]
    paths:
      - .github/workflows/asc-tf-public-link.yml
permissions:
  contents: read
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Create or reuse the public TestFlight link
        run: python3 scripts/asc-tf-public-link.py
