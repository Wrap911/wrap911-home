name: App Store setup - do not create auto-renew subscriptions
on: workflow_dispatch
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Stop
        run: |
          echo "::error::This workflow used to create auto-renewable Seat and Crew subscriptions with a 7-day trial. Those are not the products for this app. Create two non-renewing subscriptions in App Store Connect instead. Product IDs: com.wrap911.trainer.pack.12mo and com.wrap911.trainer.seat.12mo. See APPSTORE.md. Nothing was changed in App Store Connect."
          exit 1
