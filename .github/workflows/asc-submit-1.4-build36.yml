name: Submit 1.4 build 36 for App Review
# Creates or reuses version 1.4 only. Release type AFTER_APPROVAL.
# Does not change version 1.2, version 1.3, purchases, or external TestFlight.
on:
  push:
    branches: [cursor/ios-1.4-job-manager-5bbf]
    paths:
      - .github/workflows/asc-submit-1.4-build36.yml
      - scripts/asc-submit-1.4-build36.py
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Submit version 1.4 build 36
        run: python3 scripts/asc-submit-1.4-build36.py
