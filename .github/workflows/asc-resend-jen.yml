name: Resend Jen's App Store Connect invite
# Deletes a pending invite and sends a new one, or adds an existing user to the internal group.
# Does not add a build and does not submit review.
on:
  workflow_dispatch:
  push:
    branches: [cursor/ios-web-parity-1.3]
    paths:
      - .github/workflows/asc-resend-jen.yml
      - scripts/asc-resend-jen.py
permissions:
  contents: read
jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Resend Jen's invitation
        run: python3 scripts/asc-resend-jen.py
