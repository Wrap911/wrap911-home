name: TestFlight internal access
# Gives the newest upload the same internal TestFlight access as build 11.
# A push of this file to ios-capacitor starts a run. Does not submit for review or change purchases.
on:
  workflow_dispatch:
  push:
    branches: [ios-capacitor]
    paths:
      - .github/workflows/asc-testflight-access.yml
      - scripts/asc-testflight-access.py
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Compare builds and open internal testing
        run: python3 scripts/asc-testflight-access.py
