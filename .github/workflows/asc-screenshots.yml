name: App Store screenshot upload
# Replaces the iPhone 6.7" and iPad 12.9" screenshots on the editable version.
# A push of this file to ios-capacitor starts a run. Does not submit for review,
# attach a build, or change the version string.
on:
  workflow_dispatch:
  push:
    branches: [ios-capacitor]
    paths:
      - .github/workflows/asc-screenshots.yml
      - scripts/asc-screenshots.py
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography requests
      - name: Upload screenshots and report metadata gaps
        run: python3 scripts/asc-screenshots.py
