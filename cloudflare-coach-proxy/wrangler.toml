name = "wrap911-coach-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
LLM_BASE_URL = "https://api.x.ai/v1/chat/completions"
LLM_MODEL = "grok-4"
# Problem Doctor. grok-4.7 accepts image input on the Responses API.
# Override in the dashboard if xAI renames the vision model. Do not put the API key here.
LLM_VISION_MODEL = "grok-4.7"
