name = "wrap911-coach-proxy"
main = "worker.js"
# Matches the live worker (settings read 2026-11-12). Do not bump without testing.
compatibility_date = "2024-11-01"
workers_dev = true

# Plain-text vars, same values as live.
[vars]
ALLOWED_ORIGIN = "https://wrap911.com"
LLM_BASE_URL = "https://api.x.ai/v1"
LLM_MODEL = "grok-4-fast-non-reasoning"

# Seat codes, leads, Photo Fix rate limits, and email restore records.
[[kv_namespaces]]
binding = "LICENSES"
id = "76dac493b0ef4cabb574cff90acb6fae"  # wrap911-LICENSES (live)

# Secrets (set with `npx wrangler secret put NAME`, never in this file).
# Live today: LLM_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.
# Email restore adds: RESEND_API_KEY (Resend, sender info@wrap911.com).
# Without RESEND_API_KEY, POST /license/restore/start returns 503 EMAIL_NOT_CONFIGURED.
