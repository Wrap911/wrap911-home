name = "wrap911-coach-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Live settings as of 2026-10-04. Secrets (LLM_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET)
# are set in the Cloudflare dashboard, never in this file.
[vars]
ALLOWED_ORIGIN = "https://wrap911.com"
LLM_BASE_URL = "https://api.x.ai/v1"
LLM_MODEL = "grok-4-fast-non-reasoning"

[[kv_namespaces]]
binding = "LICENSES"
id = "76dac493b0ef4cabb574cff90acb6fae"
