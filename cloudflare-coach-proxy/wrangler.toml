name = "wrap911-coach-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
LLM_BASE_URL = "https://api.x.ai/v1/chat/completions"
LLM_MODEL = "grok-4"

# License server (seat codes). Create once:  npx wrangler kv namespace create LICENSES
# then paste the id below and deploy.  Web checkout also needs:  npx wrangler secret put STRIPE_SECRET_KEY
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_KV_ID"
